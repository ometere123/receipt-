name: RECEIPT! quality gates
on: [push, pull_request]
jobs:
  contract-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q contracts tests
      - run: pytest -q tests/unit
      - run: node --check tools/preflight.mjs
      - run: node --check tools/deploy-v2-studionet.mjs
      - run: node --check tools/verify-deployed-source.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run test:reconciliation
      - run: npm run lint:contracts
  genvm-direct:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: v0.3.0-rc7
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: genvm-lint check contracts/ReceiptV2.py
      - run: pytest tests/direct -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
